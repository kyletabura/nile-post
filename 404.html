    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      ? window.origin
      : '*';
    function trustedOrigin(e) {

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {

      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

        }
        if (isPageRoot || window.parent === window) return; // authoritative miss

          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.

      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {

    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);

      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

sh.href }}\" target=\"_blank\" rel=\"noopener\" aria-label=\"{{ sh.label }}\" style=\"height:38px;padding:0 14px;border-radius:999px;border:1px solid #cfd3d8;display:flex;align-items:center;font-size:13px;font-weight:800\" style-hover=\"background:#121417;border-color:#121417;color:#fff\">{{ sh.short }}<\u002Fa>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:{{ dekSize }};line-height:1.5;font-weight:600;color:#121417;text-wrap:pretty\">{{ art.dek }}<\u002Fp>\n          <sc-for list=\"{{ artRest }}\" as=\"p\" hint-placeholder-count=\"3\">\n            <p style=\"margin:0;font-size:{{ bodySize }};line-height:1.75;color:#1e2226;text-wrap:pretty\">{{ p }}<\u002Fp>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ artOriginal }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"margin:0;font-size:13px;color:#8a8f95\">Sample article text — replace with the published story.<\u002Fp><\u002Fsc-if>\n          <sc-if value=\"{{ artBrief }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;gap:12px;padding:22px 24px;border-radius:20px;background:#f3f4f6\">\n              <span style=\"font-size:15px;line-height:1.55;color:#2b2f33\">This is a Nile Pen summary of reporting by <strong>{{ art.source }}<\u002Fstrong>. Image is illustrative.<\u002Fspan>\n              <a href=\"{{ art.url }}\" target=\"_blank\" rel=\"noopener\" style=\"align-self:flex-start;display:flex;align-items:center;gap:12px;padding:6px 6px 6px 18px;border-radius:999px;background:#121417;color:#fff;font-size:14px;font-weight:800\" style-hover=\"background:#c4262e;color:#fff\">Read the full story at {{ art.source }}<span style=\"width:32px;height:32px;border-radius:50%;background:#fff;color:#121417;display:flex;align-items:center;justify-content:center\">→<\u002Fspan><\u002Fa>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <aside style=\"flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:6px;align-self:flex-start;position:{{ asidePos }};top:16px\">\n          <h2 style=\"margin:0 0 8px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:28px;text-transform:uppercase\">Recommended for you<\u002Fh2>\n          <sc-for list=\"{{ recommended }}\" as=\"s\" hint-placeholder-count=\"5\">\n            <a href=\"{{ s.href }}\" style=\"display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-top:1px solid #e3e5e8\" style-hover=\"color:#c4262e\">\n              <span style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:6px\">\n                <span style=\"font-size:16px;font-weight:700;line-height:1.3;text-wrap:pretty\">{{ s.title }}<\u002Fspan>\n                <span style=\"margin-top:auto;font-size:13px;color:#5d6166\">{{ s.date }} <span style=\"color:#cfd3d8\">|<\u002Fspan> <span style=\"color:#c4262e;font-weight:700\">{{ s.topicName }}<\u002Fspan><\u002Fspan>\n              <\u002Fspan>\n              <span style=\"flex:none;position:relative;width:84px;height:64px;border-radius:12px;overflow:hidden;background:#e3e5e8\">\n                <image-slot id=\"{{ s.slotRec }}\" shape=\"rect\" src=\"{{ s.img }}\" placeholder=\"\" style=\"position:absolute;inset:0\"><\u002Fimage-slot>\n              <\u002Fspan>\n            <\u002Fa>\n          <\u002Fsc-for>\n        <\u002Faside>\n      <\u002Fdiv>\n\n      <section style=\"max-width:1240px;width:100%;margin:0 auto;padding:{{ relPad }};display:flex;flex-direction:column;gap:22px\">\n        <div style=\"display:flex;align-items:center;gap:14px;padding-bottom:12px;border-bottom:1px solid #e3e5e8\">\n          <span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;text-transform:uppercase;background:#c4262e;color:#fff;padding:4px 14px;border-radius:999px\">In the headlines<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:{{ cardGridGap }}\">\n          <sc-for list=\"{{ related }}\" as=\"s\" hint-placeholder-count=\"4\">\n            <a href=\"{{ s.href }}\" style=\"display:grid;grid-template-columns:{{ cardCols }};grid-template-rows:{{ cardRows }};grid-template-areas:{{ cardAreas }};gap:{{ cardGap }};padding:{{ cardPad }};border-bottom:{{ cardLine }};min-width:0\" style-hover=\"color:#121417\">\n              <div style=\"grid-area:img;position:relative;aspect-ratio:{{ cardRatio }};background:#e3e5e8;border-radius:{{ cardImgR }};overflow:hidden\">\n                <image-slot id=\"{{ s.slotRel }}\" shape=\"rect\" src=\"{{ s.img }}\" placeholder=\"Story image\" style=\"position:absolute;inset:0\"><\u002Fimage-slot>\n                <span style=\"position:absolute;left:10px;bottom:10px;display:{{ cardBadge }};font-size:12px;font-weight:800;background:rgba(18,20,23,.85);color:#fff;padding:4px 10px;border-radius:999px\">{{ s.read }}<\u002Fspan>\n              <\u002Fdiv>\n              <h3 style=\"grid-area:title;margin:0;font-size:{{ cardTitleSize }};font-weight:{{ cardTitleW }};line-height:1.3;text-wrap:pretty\">{{ s.title }}<\u002Fh3>\n              <span style=\"grid-area:meta;align-self:end;margin-top:auto;font-size:13px;color:#5d6166\">{{ s.date }} <span style=\"color:#cfd3d8\">|<\u002Fspan> <span style=\"color:#c4262e;font-weight:700\">{{ s.topicName }}<\u002Fspan><\u002Fspan>\n            <\u002Fa>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Farticle>\n  <\u002Fsc-if>\n\n  <!-- ===== ABOUT ===== -->\n  <sc-if value=\"{{ isAbout }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:40px 24px 64px;display:flex;flex-wrap:wrap;gap:48px\">\n      <div style=\"flex:1 1 320px;display:flex;flex-direction:column;gap:16px\">\n        <div style=\"position:relative;aspect-ratio:4/5;max-width:380px;background:#e3e5e8;margin-top:8px;border-radius:18px;overflow:hidden\">\n          <image-slot id=\"about-founder\" shape=\"rect\" placeholder=\"Drop founder portrait — Dalia Mori Wanki\" style=\"position:absolute;inset:0\"><\u002Fimage-slot>\n        <\u002Fdiv>\n        <span style=\"font-size:14px;color:#5d6166\">Dalia Mori Wanki, Founder &amp; Editor · Kampala, Uganda<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"flex:2 1 460px;display:flex;flex-direction:column;gap:20px;font-size:18px;line-height:1.7;color:#1e2226;max-width:700px\">\n        <p style=\"margin:0\">The Nile Pen was founded by <strong>Dalia Mori Wanki<\u002Fstrong>, a young writer based in Kampala, Uganda, who grew tired of watching stories about South Sudan and the African continent get flattened into headlines — stripped of context, nuance, and the humanity of the people living inside them.<\u002Fp>\n        <p style=\"margin:0\">This platform exists because young Africans — and young South Sudanese especially — deserve journalism that treats them as intelligent people. Not summaries. Not charity. Real, honest, well-crafted stories about climate, justice, and politics, written by people who are not just covering these issues from the outside, but living them.<\u002Fp>\n        <blockquote style=\"margin:8px 0;font-size:24px;font-weight:800;line-height:1.35;border-left:6px solid #c4262e;padding-left:22px\">\"Young Africans deserve stories that treat them as intelligent people — not just headlines, but context, depth, and truth told from the inside.\"<\u002Fblockquote>\n        <p style=\"margin:0\">What makes The Nile Pen different is that it is personal. The reporting comes from inside — from writers who carry these stories in their own lives, their own families, their own futures. That closeness is not a bias. It is the whole point.<\u002Fp>\n        <p style=\"margin:0\">The vision is simple and ambitious: to become the platform where young African writers bring their best work, and a name that earns a seat at the table — in UN forums, at climate conferences, and in the journalism fellowships shaping the next generation of global storytelling.<\u002Fp>\n        <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-top:8px\">\n          <a href=\"#/submit\" style=\"font-size:15px;font-weight:800;padding:12px 20px;background:#c4262e;color:#fff;border-radius:999px\" style-hover=\"background:#a51d24;color:#fff\">Submit your story →<\u002Fa>\n          <a href=\"#/team\" style=\"font-size:15px;font-weight:800;padding:12px 20px;border:1px solid #121417;border-radius:999px\" style-hover=\"background:#121417;color:#fff\">Meet our writers<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===== TEAM ===== -->\n  <sc-if value=\"{{ isTeam }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:40px 24px 64px;display:flex;flex-direction:column;gap:28px\">\n      \n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:20px\">\n        <sc-for list=\"{{ team }}\" as=\"m\" hint-placeholder-count=\"7\">\n          <div style=\"display:flex;gap:16px;align-items:flex-start;padding:20px;background:#f3f4f6;border-radius:18px\">\n            <div style=\"flex:none;position:relative;width:72px;height:72px;background:#e3e5e8\">\n              <image-slot id=\"{{ m.slot }}\" shape=\"circle\" src=\"{{ m.portrait }}\" placeholder=\"Photo\" style=\"position:absolute;inset:0\"><\u002Fimage-slot>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:6px;min-width:0\">\n              <span style=\"font-size:18px;font-weight:900\">{{ m.name }}<\u002Fspan>\n              <span style=\"font-size:14px;color:#5d6166\">{{ m.role }}<\u002Fspan>\n              <a href=\"{{ m.href }}\" style=\"margin-top:auto;font-size:15px;font-weight:700;line-height:1.35;color:#c4262e\">{{ m.link }}<\u002Fa>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===== SUBMIT ===== -->\n  <sc-if value=\"{{ isSubmit }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:{{ subPagePad }};display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:{{ subGap }};align-items:start\">\n      <div style=\"display:flex;flex-direction:column;gap:40px;max-width:460px\">\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <h2 style=\"margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:34px;line-height:1;text-transform:uppercase\">What we're looking for<\u002Fh2>\n          <ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px\">\n            <li style=\"display:flex;gap:10px;font-size:16px;line-height:1.5\"><span style=\"flex:none;width:8px;height:8px;margin-top:8px;border-radius:50%;background:#c4262e\"><\u002Fspan>Reporting and essays on climate, justice, land and politics in South Sudan and the region<\u002Fli>\n            <li style=\"display:flex;gap:10px;font-size:16px;line-height:1.5\"><span style=\"flex:none;width:8px;height:8px;margin-top:8px;border-radius:50%;background:#c4262e\"><\u002Fspan>First-hand perspective: you live it, work in it, or have spent time on the ground<\u002Fli>\n            <li style=\"display:flex;gap:10px;font-size:16px;line-height:1.5\"><span style=\"flex:none;width:8px;height:8px;margin-top:8px;border-radius:50%;background:#c4262e\"><\u002Fspan>A clear reason the story matters now<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:20px\">\n          <h2 style=\"margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:34px;line-height:1;text-transform:uppercase\">How it works<\u002Fh2>\n          <div style=\"display:flex;gap:16px;align-items:flex-start\">\n              <span style=\"flex:none;width:36px;height:36px;border-radius:50%;background:#121417;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px\">1<\u002Fspan>\n              <div style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font-size:17px;font-weight:800\">Send a short pitch<\u002Fspan><span style=\"font-size:15px;line-height:1.55;color:#5d6166;text-wrap:pretty\">What the story is, why it matters now, and why you are the person to tell it.<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <div style=\"display:flex;gap:16px;align-items:flex-start\">\n              <span style=\"flex:none;width:36px;height:36px;border-radius:50%;background:#121417;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px\">2<\u002Fspan>\n              <div style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font-size:17px;font-weight:800\">An editor reads it<\u002Fspan><span style=\"font-size:15px;line-height:1.55;color:#5d6166;text-wrap:pretty\">Every pitch is read. If it fits, we reply by email to talk through the angle.<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <div style=\"display:flex;gap:16px;align-items:flex-start\">\n              <span style=\"flex:none;width:36px;height:36px;border-radius:50%;background:#121417;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px\">3<\u002Fspan>\n              <div style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font-size:17px;font-weight:800\">We work on it together<\u002Fspan><span style=\"font-size:15px;line-height:1.55;color:#5d6166;text-wrap:pretty\">You write the draft; we edit, fact-check and publish it under your name.<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #e3e5e8;border-radius:28px;padding:clamp(24px,4vw,40px);box-shadow:0 24px 60px -30px rgba(18,20,23,.25)\">\n        <sc-if value=\"{{ formOpen }}\" hint-placeholder-val=\"{{ true }}\">\n          <form sc-camel-on-submit=\"{{ submitForm }}\" style=\"display:flex;flex-direction:column;gap:22px\">\n            <div style=\"display:flex;flex-direction:column;gap:6px\">\n              <span style=\"font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#c4262e\">Your pitch<\u002Fspan>\n              <span style=\"font-size:26px;font-weight:900;line-height:1.15\">Tell us about your story<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px\">\n              <label style=\"display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:700\">Full name<input required=\"\" style=\"font-size:16px;padding:14px 18px;border:1px solid #cfd3d8;outline-color:#c4262e;border-radius:999px;background:#fff\"><\u002Flabel>\n              <label style=\"display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:700\">Email<input type=\"email\" required=\"\" style=\"font-size:16px;padding:14px 18px;border:1px solid #cfd3d8;outline-color:#c4262e;border-radius:999px;background:#fff\"><\u002Flabel>\n            <\u002Fdiv>\n            <label style=\"display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:700\">Where are you based?<input placeholder=\"City, country\" style=\"font-size:16px;padding:14px 18px;border:1px solid #cfd3d8;outline-color:#c4262e;border-radius:999px;background:#fff\"><\u002Flabel>\n            <div style=\"display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:700\">Section\n              <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n                <sc-for list=\"{{ pitchTopics }}\" as=\"t\" hint-placeholder-count=\"6\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ t.pick }}\" style=\"font-size:14px;font-weight:700;padding:9px 16px;border-radius:999px;cursor:pointer;border:1px solid {{ t.bd }};background:{{ t.bg }};color:{{ t.fg }}\">{{ t.name }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <label style=\"display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:700\">Working headline<input required=\"\" style=\"font-size:16px;padding:14px 18px;border:1px solid #cfd3d8;outline-color:#c4262e;border-radius:999px;background:#fff\"><\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:700\"><span style=\"display:flex;justify-content:space-between;gap:12px\">Your pitch<span style=\"font-weight:600;color:{{ pitchCountColor }}\">{{ pitchCount }}<\u002Fspan><\u002Fspan><textarea required=\"\" rows=\"7\" sc-camel-on-input=\"{{ pitchInput }}\" placeholder=\"What is the story, and why does it matter now?\" style=\"font-size:16px;line-height:1.55;padding:16px 18px;border:1px solid #cfd3d8;resize:vertical;outline-color:#c4262e;border-radius:18px;font-family:inherit\"><\u002Ftextarea><\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:700\">Links to previous work (optional)<input placeholder=\"https://\" style=\"font-size:16px;padding:14px 18px;border:1px solid #cfd3d8;outline-color:#c4262e;border-radius:999px;background:#fff\"><\u002Flabel>\n            <label style=\"display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.5;color:#2b2f33;cursor:pointer\"><input type=\"checkbox\" required=\"\" style=\"margin-top:3px;width:18px;height:18px;accent-color:#c4262e\">This is my original work and has not been published elsewhere.<\u002Flabel>\n            <button type=\"submit\" style=\"align-self:flex-start;display:flex;align-items:center;gap:12px;padding:6px 6px 6px 22px;border:0;border-radius:999px;background:#c4262e;color:#fff;font-size:16px;font-weight:800;cursor:pointer\" style-hover=\"background:#a51d24\">Send pitch<span style=\"width:38px;height:38px;border-radius:50%;background:#fff;color:#c4262e;display:flex;align-items:center;justify-content:center;font-size:17px\">→<\u002Fspan><\u002Fbutton>\n          <\u002Fform>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ formDone }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:14px;align-items:flex-start;padding:24px 0\">\n            <span style=\"width:56px;height:56px;border-radius:50%;background:#c4262e;color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900\">✓<\u002Fspan>\n            <span style=\"font-size:26px;font-weight:900;line-height:1.15\">Thank you — your pitch has been sent.<\u002Fspan>\n            <span style=\"font-size:16px;line-height:1.6;color:#2b2f33\">Our editors read every submission and will reply by email.<\u002Fspan>\n            <a href=\"#/\" style=\"margin-top:6px;font-size:15px;font-weight:800;padding:12px 20px;border:1px solid #121417;border-radius:999px;color:#121417\" style-hover=\"background:#121417;color:#fff\">Back to the homepage<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===== LIVE ===== -->\n  <sc-if value=\"{{ isLive }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width:760px;margin:0 auto;padding:36px 20px 72px;display:flex;flex-direction:column;gap:22px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:14px;color:#5d6166\">\n        <span>Updated {{ liveUpdated }}<\u002Fspan>\n        <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n          <sc-for list=\"{{ liveTags }}\" as=\"t\" hint-placeholder-count=\"3\">\n            <a href=\"{{ t.href }}\" style=\"font-size:12px;font-weight:800;padding:5px 12px;border-radius:999px;border:1px solid #121417;color:#121417\" style-hover=\"background:#121417;color:#fff\">{{ t.name }}<\u002Fa>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#f3f4f6;border-radius:24px;padding:26px 28px;display:flex;flex-direction:column;gap:22px\">\n        <sc-for list=\"{{ liveKey }}\" as=\"g\" hint-placeholder-count=\"2\">\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <span style=\"display:flex;align-items:center;gap:12px;font-size:20px;font-weight:900\"><span style=\"width:6px;height:22px;border-radius:3px;background:#c4262e\"><\u002Fspan>{{ g.name }}<\u002Fspan>\n            <sc-for list=\"{{ g.items }}\" as=\"k\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex;gap:12px;font-size:15px;line-height:1.45;color:#2b2f33\"><span style=\"flex:none;width:7px;height:7px;margin-top:8px;border-radius:50%;background:#121417\"><\u002Fspan><span style=\"text-wrap:pretty\">{{ k.title }} <button sc-camel-on-click=\"{{ k.jump }}\" style=\"border:0;background:none;padding:0;font-size:14px;font-weight:800;color:#c4262e;cursor:pointer;font-family:inherit\">View post ↓<\u002Fbutton><\u002Fspan><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;justify-content:flex-end;align-items:center;gap:10px;font-size:14px;font-weight:700\">\n        Sort by:\n        <div style=\"display:flex;padding:3px;border-radius:999px;border:1px solid #cfd3d8\">\n          <sc-for list=\"{{ liveSorts }}\" as=\"o\" hint-placeholder-count=\"2\">\n            <button sc-camel-on-click=\"{{ o.pick }}\" style=\"border:0;padding:7px 14px;border-radius:999px;font-size:13px;font-weight:800;cursor:pointer;background:{{ o.bg }};color:{{ o.fg }}\">{{ o.name }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:22px\">\n        <sc-for list=\"{{ liveAll }}\" as=\"u\" hint-placeholder-count=\"4\">\n          <div id=\"{{ u.postId }}\" style=\"display:grid;grid-template-columns:{{ liveCols }};gap:16px;align-items:start;scroll-margin-top:16px\">\n            <div style=\"display:flex;flex-direction:{{ liveTimeDir }};gap:4px 10px;padding-top:{{ liveTimePad }}\"><span style=\"font-size:15px;font-weight:800\">{{ u.ago }}<\u002Fspan><span style=\"font-size:14px;color:#5d6166\">{{ u.short }}<\u002Fspan><\u002Fdiv>\n            <article style=\"border-radius:20px;overflow:hidden;background:{{ u.cardBg }};color:{{ u.cardFg }};border:1px solid {{ u.cardBd }};border-top:4px solid {{ u.cardTop }};padding:22px 22px 18px;display:flex;flex-direction:column;gap:14px\">\n              <h3 style=\"margin:0;font-size:20px;font-weight:900;line-height:1.25;text-wrap:pretty\">{{ u.title }}<\u002Fh3>\n              <sc-for list=\"{{ u.body }}\" as=\"p\" hint-placeholder-count=\"2\">\n                <p style=\"margin:0;font-size:16px;line-height:1.6;text-wrap:pretty\">{{ p }}<\u002Fp>\n              <\u002Fsc-for>\n              <a href=\"{{ u.href }}\" style=\"position:relative;display:block;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#e3e5e8\">\n                <image-slot id=\"{{ u.slotLive }}\" shape=\"rect\" src=\"{{ u.img }}\" placeholder=\"Update image\" style=\"position:absolute;inset:0\"><\u002Fimage-slot>\n              <\u002Fa>\n              <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-top:4px\">\n                <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap\">\n                  <sc-if value=\"{{ u.pinned }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:#c4262e;color:#fff\">★ Pinned<\u002Fspan><\u002Fsc-if>\n                  <a href=\"{{ u.url }}\" target=\"_blank\" rel=\"noopener\" style=\"font-size:13px;font-weight:800;color:{{ u.linkFg }}\" style-hover=\"text-decoration:underline;color:{{ u.linkFg }}\">Source: {{ u.source }} ↗<\u002Fa>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:6px\">\n                  <sc-for list=\"{{ u.shares }}\" as=\"sh\" hint-placeholder-count=\"4\">\n                    <a href=\"{{ sh.href }}\" target=\"_blank\" rel=\"noopener\" aria-label=\"{{ sh.label }}\" style=\"height:34px;min-width:34px;padding:0 10px;border-radius:999px;border:1px solid {{ u.cardBd }};display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:{{ u.cardFg }}\" style-hover=\"background:#c4262e;border-color:#c4262e;color:#fff\">{{ sh.short }}<\u002Fa>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Farticle>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===== CONTACT ===== -->\n  <sc-if value=\"{{ isContact }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:40px 24px 64px;display:flex;flex-wrap:wrap;gap:48px\">\n      <div style=\"flex:1 1 320px;display:flex;flex-direction:column;gap:14px\">\n        <p style=\"margin:0;font-size:18px;line-height:1.6;color:#2b2f33\">{{ contactIntro }}<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:2 1 460px;max-width:680px\">\n        <sc-if value=\"{{ formOpen }}\" hint-placeholder-val=\"{{ true }}\">\n          <form sc-camel-on-submit=\"{{ submitForm }}\" style=\"display:flex;flex-direction:column;gap:16px\">\n            <div style=\"display:flex;flex-wrap:wrap;gap:16px\">\n              <label style=\"flex:1 1 220px;display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700\">Name<input required=\"\" style=\"font-size:16px;padding:12px;border:1px solid #cfd3d8;outline-color:#c4262e;border-radius:999px;padding-left:18px\"><\u002Flabel>\n              <label style=\"flex:1 1 220px;display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700\">Email<input type=\"email\" required=\"\" style=\"font-size:16px;padding:12px;border:1px solid #cfd3d8;outline-co urnalists, and thinkers shaping the regional conversation.' }\n];\nconst TOPIC_ORDER = ['south-sudan', 'human-rights', 'water-land', 'diaspora', 'climate', 'opinion'];\nTOPICS.sort((a, b) => TOPIC_ORDER.indexOf(a.slug) - TOPIC_ORDER.indexOf(b.slug));\nconst POOL = {\n  'climate': ['arid-land-with-dry-cracked-ground-global-warming_1150-16308.jpg', 'high-angle-shot-muddy-river-going-through-desert-captured-samburu-kenya_181624-7615.jpg', 'elderly-men-find-fish-dry-ground-global-warming_1150-16283.jpg', 'trees-grown-dry-cracked-dry-soil-dry-season-global-warming_1150-16286.jpg', 'beautiful-green-landscape-with-marsh-cloudy-sky_181624-19393.jpg', 'silhouette-people-fishing-river-forest-twilight_1150-10800.jpg'],\n  'south-sudan': ['black-woman-city_1157-17514.jpg', 'three-afican-american-people-talking-street_1303-8967.jpg', 'group-people-waiting-cross-road_53876-65331.jpg', 'beautiful-african-girl-talking-cellphone_176420-5424.jpg', 'young-attractive-african-male-photographer-with-camera-street-sunlight_181624-34926.jpg'],\n  'human-rights': ['low-angle-view-african-american-woman-with-armcrossing-gesture-participating-protest-human-rights_637285-6728.jpg', 'journalist-taking-interview-from-man_23-2149029310.jpg', 'group-people-taking-interview-outdoors_23-2149029316.jpg', 'red-microphone-news-reporting-interviews_187299-47083.jpg', 'close-up-young-reporter-describing-situation-live_23-2149037863.jpg'],\n  'water-land': ['water-power-plant-ter-river_1398-3118.jpg', 'dam-ter-river-sau-reservoir_1398-3187.jpg', 'hydro-electric-power-station-river_1398-3200.jpg', 'aerial-view-winding-river-through-lush-daintree-rainforest_1308-188884.jpg', 'beautiful-shot-landscape-green-field-with-water-streams_181624-20782.jpg'],\n  'diaspora': ['black-woman-with-suitcase-airport_1157-33364.jpg', 'woman-with-phone-airport_1303-9582.jpg', 'young-businesswoman-waiting-airport-terminal-checking-mobile-phone_618663-92.jpg', 'african-american-man-checkered-shirt-sunglasses-jeans-with-suitcase-backpack-black-man-traveler-duty-free_627829-2823.jpg', 'portrait-girl-with-trolley-city_641386-27.jpg'],\n  'opinion': ['porcelain-cup-with-coffee-stands-before-newspapers-book_8353-1501.jpg', 'male-journalist-doing-his-job_23-2149029367.jpg', 'eyewear-pen-opened-diary-desk_1137-3.jpg', 'hands-writing-notebook_1150-1990.jpg', 'woman-writining-notebook_53876-165181.jpg', 'rear-view-woman-writing-note_53876-20869.jpg', 'open-leather-notebook-table_53876-14516.jpg']\n};\nconst PORTRAITS = {\n  'forgotten-floods': 'african-woman-successful-entrepreneur-wearing-glasses-face-portrait_53876-148050.jpg',\n  'drought-debt-displacement': 'african-american-woman-smiling-beige-background_53876-126965.jpg',\n  'juba-negotiations': 'african-american-businessman-gray-suit-studio-portrait_53876-102940.jpg',\n  'press-freedom-nile-basin': 'african-american-woman-black-long-sleeve-tee-portrait_53876-98562.jpg',\n  'kampala-to-london': 'african-american-woman-smiling-blue-background_53876-111311.jpg',\n  'nile-agreement-gerd': 'close-up-portrait-african-man-looking-camera_171337-12860.jpg'\n};\nconst ORIGINAL_DATES = { 'forgotten-floods': '2026-06-20', 'drought-debt-displacement': '2026-06-18', 'juba-negotiations': '2026-06-14', 'press-freedom-nile-basin': '2026-06-10', 'kampala-to-london': '2026-06-06', 'nile-agreement-gerd': '2026-06-02' };\nconst ORIGINALS = [\n  { id: 'forgotten-floods', topic: 'climate', title: \"The Forgotten Floods: How South Sudan's Wetlands Are Disappearing\", dek: 'Across the Sudd basin, communities are watching the land they have farmed for generations drain away. This is not just an ecological crisis — it is a political one.', author: 'Amara Deng Kuol', date: 'June 2026', read: '12 min read', img: IMG + 'beautiful-shot-landscape-green-field-with-water-streams_181624-20782.jpg', body: [\n    'In the Sudd, one of the largest wetlands on the African continent, the seasons used to follow a rhythm families could plan around. Floodwaters rose, grazing land shifted, fish returned, and communities moved with the water. That rhythm is breaking.',\n    'Residents describe dry seasons that stretch longer and floods that arrive with less warning and greater force. Pastures that once recovered each year now stay underwater or turn to hard, cracked ground. For cattle-keeping communities, the loss of reliable grazing is a loss of income, food and social standing at once.',\n    'The causes are tangled: shifting rainfall patterns, upstream water management, and decades of underinvestment in the people who depend on the wetland. Decisions made in capitals and boardrooms far from the Sudd land hardest on those with the least say in them.',\n    'That is why this is a political story as much as an ecological one. Who gets warned, who gets relocated, who gets compensated, and who gets left out are choices. The communities of the Sudd are asking that those choices be made with them, not about them.'] },\n  { id: 'drought-debt-displacement', topic: 'climate', title: \"Drought, Debt and Displacement: Who Owes What to East Africa's Climate Refugees?\", dek: 'As climate-induced migration reshapes the Horn of Africa, a new generation of legal scholars and activists are making the case that historical emissions must come with reparations — and they are bringing that argument to international courts.', author: 'Leila Hassan', date: 'June 18, 2026', read: '9 min read', img: IMG + 'elderly-man-sat-hugging-his-knees-bent-dry-soil-looked-sky_1150-16259.jpg', body: [\n    'Across East Africa, families are leaving land that can no longer support them. Some move to nearby towns; others cross borders. Many are counted in humanitarian reports, but few are recognised in law as people displaced by climate change.',\n    'A growing group of legal scholars and activists argue that this gap is not an accident. The countries least responsible for historical emissions are bearing the heaviest costs, and the international system has been slow to say who should pay.',\n    'Their case rests on a simple idea: harm creates responsibility. They are pressing it through climate negotiations, regional courts and international legal opinions, asking judges to treat loss and damage as an obligation rather than an act of charity.',\n    'For the people at the centre of the argument, the debate is not abstract. It decides whether support arrives as a loan, a grant or not at all — and whether their displacement is treated as a tragedy or as an injustice with a remedy.'] },\n  { id: 'juba-negotiations', topic: 'south-sudan', title: 'What the Juba Negotiations Actually Mean for Ordinary Citizens', dek: 'Beyond the diplomatic language, the stakes for South Sudanese families remain urgent and largely unaddressed.', author: 'Moses Taban', date: 'June 14, 2026', read: '7 min read', img: IMG + 'group-people-waiting-cross-road_53876-65331.jpg', body: [\n    'Peace talks are often reported in the language of delegations, communiqués and deadlines. For most South Sudanese, the questions are more direct: Will the roads be safe? Will salaries be paid? Will children be able to stay in school?',\n    'The current round of negotiations in Juba touches all of these, but the connection between what is signed and what changes in daily life is rarely explained. Agreements on security arrangements, revenue sharing and elections take years to turn into anything people can feel.',\n    'Many citizens describe a fatigue with process — not a rejection of peace, but a wariness of promises that have been made before. Their priorities are practical: stability, basic services and a say in how the country is run.',\n    'Understanding what the Juba talks mean requires following them past the press conference and into markets, clinics and classrooms. That is where the success or failure of any agreement will be measured.'] },\n  { id: 'press-freedom-nile-basin', topic: 'human-rights', title: 'Press Freedom in the Nile Basin: A Shrinking Space', dek: 'Journalists across the region are navigating detention, censorship, and self-censorship — yet independent reporting persists.', author: 'Fatima Al-Rashid', date: 'June 10, 2026', read: '8 min read', img: IMG + 'female-journalist-telling-news-outside_23-2149029325.jpg', body: [\n    'Reporting from the Nile Basin has always required courage. Today it also requires a careful reading of laws, platforms and unwritten rules that change quickly and are enforced unevenly.',\n    'Journalists across the region describe a familiar set of pressures: arrests and detentions, accreditation that can be withdrawn, internet shutdowns during sensitive moments, and online harassment that follows them home. The most pervasive pressure is quieter — the self-censorship that comes from knowing what has happened to colleagues.',\n    'And yet independent reporting persists. Small newsrooms, freelancers and exile outlets continue to document what official channels leave out, often with limited resources and real personal risk.',\n    'Protecting that work is not only a question for journalists. Citizens who rely on accurate information to make decisions about their safety, their votes and their futures have the most to lose when the space for reporting closes.'] },\n  { id: 'kampala-to-london', topic: 'diaspora', title: 'From Kampala to London: How the South Sudanese Diaspora is Funding Change', dek: 'Remittances and advocacy networks are increasingly influential in shaping both policy and community resilience back home.', author: 'Sarah Ochan', date: 'June 6, 2026', read: '8 min read', img: IMG + 'black-woman-with-suitcase-airport_1157-33370.jpg', body: [\n    'From Kampala and Nairobi to London and beyond, South Sudanese communities abroad remain closely tied to home. Those ties are emotional and familial, but they are increasingly financial and political as well.',\n    'Remittances help families pay school fees, medical bills and rent. Collective funds support clinics, boreholes and scholarships. For many households, money sent from abroad is the most reliable source of income they have.',\n    'Diaspora networks are also organising around advocacy — briefing foreign governments, supporting peace initiatives and amplifying voices that struggle to be heard from inside the country. Their influence brings questions too, about accountability and about who speaks for whom.',\n    'This story follows the people building those bridges, and the grief, obligation and hope that keep them connected to a country many have not lived in for years.'] },\n  { id: 'nile-agreement-gerd', topic: 'water-land', title: \"The Nile Agreement That Wasn't: Unpacking the GERD Standoff\", dek: \"As Ethiopia's Grand Renaissance Dam shifts the region's power balance, downstream nations face a future of uncertainty and negotiation.\", author: 'Omar Khalil', date: 'June 2, 2026', read: '10 min read', img: IMG + 'gray-concrete-dam-daytime_400718-18.jpg', body: [\n    'The Grand Ethiopian Renaissance Dam is one of the largest infrastructure projects in Africa. For Ethiopia it represents electricity, development and national pride. For downstream nations, it raises urgent questions about water security.',\n    'Years of negotiations between Ethiopia, Sudan and Egypt have produced statements of intent but no binding agreement on how the dam should be filled and operated, particularly during drought years. Each side frames the issue differently, and each has domestic pressures that make compromise costly.',\n    'Lost in much of the coverage are the communities along the river whose livelihoods depend on its flow — farmers, fishers and towns that will live with whatever arrangement is reached, or with the consequences of none.',\n    'Unpacking the standoff means looking beyond the rhetoric of sovereignty and survival to the practical mechanisms that could make shared use of the Nile workable: data sharing, drought protocols and institutions that outlast political cycles.'] }\n];\n// Real re
